a:"Glc",n:"葡萄糖",e:"Glucose",f:"C₆H₁₂O₆",x:180,y:300,p:"gly",d:["血糖的正常范围 3.89–6.11 mmol/L。","进入细胞靠 GLUT 转运体，不耗能（顺浓度梯度）。","肝细胞由葡糖激酶（己糖激酶Ⅳ型）磷酸化，Km 约 10 mmol/L。"]},G6P:{a:"G-6-P",n:"葡糖-6-磷酸",e:"Glucose-6-phosphate",f:"C₆H₁₃O₉P",x:340,y:300,p:"gly",d:["🟥 <b>联系糖代谢各条途径的枢纽物质</b>：可去糖酵解、糖原、戊糖磷酸途径、糖异生。",'带负电，不能自由通过细胞膜 → 被磷酸化的糖"锁"在细胞内。',"由己糖激酶催化生成，该步不可逆。"]},F6P:{a:"F-6-P",n:"果糖-6-磷酸",e:"Fructose-6-phosphate",f:"C₆H₁₃O₉P",x:340,y:410,p:"gly",d:["果糖-6-磷酸 ＋ 谷氨酰胺 → 葡糖胺-6-磷酸，是己糖胺途径的起点。","磷酸己糖异构酶催化其与 G-6-P 互变（醛糖↔酮糖）。"]},F16BP:{a:"F-1,6-BP",n:"果糖-1,6-二磷酸",e:"Fructose-1,6-bisphosphate",f:"C₆H₁₄O₁₂P₂",x:340,y:520,p:"gly",d:["🟥 PFK-1 的产物，也是丙酮酸激酶的别构激活剂（前馈激活）。","由醛缩酶裂解为磷酸二羟丙酮与甘油醛-3-磷酸。","糖异生时由果糖二磷酸酶-1 水解回 F-6-P。"]},DHAP:{a:"DHAP",n:"磷酸二羟丙酮",e:"Dihydroxyacetone phosphate",f:"C₃H₇O₆P",x:200,y:630,p:"gly",d:["🟧 可还原为甘油-3-磷酸 → 是糖代谢与脂肪代谢的枢纽。","与甘油醛-3-磷酸由丙糖磷酸异构酶相互转化。"]},G3P:{a:"G-3-P",n:"甘油醛-3-磷酸",e:"Glyceraldehyde-3-phosphate",f:"C₃H₇O₆P",x:340,y:630,p:"gly",d:["糖酵解后半段的起点，1 分子葡萄糖产生 2 分子。","戊糖磷酸途径的碳架也回流到这里。"]},BPG13:{a:"1,3-BPG",n:"甘油酸-1,3-二磷酸",e:"1,3-Bisphosphoglycerate",f:"C₃H₈O₁₀P₂",x:340,y:740,p:"gly",d:["🟥 含<b>混合酸酐</b>高能键，是底物水平磷酸化的能量来源。","由甘油醛-3-磷酸脱氢酶催化，同时产生 NADH。","红细胞中 2,3-BPG 的类似物调节血红蛋白亲和力（另见 2,3-DPG 支路）。"]},PG3:{a:"3-PG",n:"甘油酸-3-磷酸",e:"3-Phosphoglycerate",f:"C₃H₇O₇P",x:340,y:850,p:"gly",d:["磷酸甘油酸激酶催化 1,3-BPG → 3-PG，产 1 个 ATP（第一次底物水平磷酸化）。","可逆，但逆反应要消耗 1 个 ATP。"]},PG2:{a:"2-PG",n:"甘油酸-2-磷酸",e:"2-Phosphoglycerate",f:"C₃H₇O₇P",x:340,y:950,p:"gly",d:["磷酸甘油酸变位酶把磷酸从 C3 移到 C2。","为下一步烯醇化脱水作准备。"]},PEP:{a:"PEP",n:"磷酸烯醇式丙酮酸",e:"Phosphoenolpyruvate",f:"C₃H₅O₆P",x:340,y:1060,p:"gly",d:["🟥 体内<b>能量最高</b>的磷酸化合物之一（水解 ΔG°′ ≈ −61.9 kJ/mol）。","烯醇化酶催化 2-PG 脱水生成，分子内电子重排造出高能键。","糖异生时由 PEPCK 消耗 1 个 GTP，催化 OAA → PEP。"]},PYR:{a:"Pyr",n:"丙酮酸",e:"Pyruvate",f:"C₃H₄O₃",x:340,y:1170,p:"gly",d:["🟥 三条去路：①无氧 → 乳酸（LDH）；②有氧 → 乙酰CoA（PDH）；③羧化 → 草酰乙酸（糖异生）。","丙酮酸激酶催化 PEP → 丙酮酸，产 ATP，不可逆。","肝内丙氨酸可别构抑制丙酮酸激酶。"]},LAC:{a:"Lac",n:"乳酸",e:"Lactate",f:"C₃H₆O₃",x:180,y:1170,p:"gly",d:["由乳酸脱氢酶催化丙酮酸还原生成，<b>目的是把 NADH 氧化回 NAD⁺</b>，让糖酵解能继续。","肌内乳酸经血液到肝，异生为葡萄糖再回肌 —— Cori 循环。","红细胞无线粒体，只能靠无氧氧化，终产物也是乳酸。"]},PGL6:{a:"6-PGL",n:"6-磷酸葡萄糖酸内酯",e:"6-Phosphogluconolactone",f:"C₆H₁₁O₉P",x:500,y:200,p:"ppp",d:["G6PD 催化 G-6-P 氧化脱氢生成，同时把 NADP⁺ 还原为 NADPH。","🟥 G6PD 是该途径的限速酶。"]},PG6:{a:"6-PG",n:"6-磷酸葡萄糖酸",e:"6-Phosphogluconate",f:"C₆H₁₃O₁₀P",x:630,y:200,p:"ppp",d:["由内酯酶水解内酯生成。","下一步氧化脱羧，生成核酮糖-5-磷酸。"]},RU5P:{a:"Ru-5-P",n:"核酮糖-5-磷酸",e:"Ribulose-5-phosphate",f:"C₅H₁₁O₈P",x:760,y:200,p:"ppp",d:["氧化阶段的产物。","两种去向：异构化 → 核糖-5-磷酸；差向异构化 → 木酮糖-5-磷酸。"]},R5P:{a:"R-5-P",n:"核糖-5-磷酸",e:"Ribose-5-phosphate",f:"C₅H₁₁O₈P",x:890,y:200,p:"ppp",d:["🟥 核苷酸合成的原料：与 ATP 生成 PRPP。","核酸合成旺盛的组织（骨髓、肿瘤）此途径活跃。"]},XU5P:{a:"Xu-5-P",n:"木酮糖-5-磷酸",e:"Xylulose-5-phosphate",f:"C₅H₁₁O₈P",x:760,y:310,p:"ppp",d:["基团转移阶段的底物。","转酮醇酶转移 2 碳单位，转醛醇酶转移 3 碳单位，最终拼回 F-6-P 与 G-3-P。"]},ACOA:{a:"AcCoA",n:"乙酰辅酶A",e:"Acetyl-CoA",f:"CH₃—CO~S—CoA",x:480,y:660,p:"tca",d:["🟥 三大营养物质分解的<b>共同中间产物</b>，代谢的十字路口。","高能硫酯键（~S）水解时释能，驱动柠檬酸合成。","来源：糖（PDH）、脂（β-氧化）、氨基酸（生酮氨基酸）。"]},CIT:{a:"Cit",n:"柠檬酸",e:"Citrate",f:"C₆H₈O₇",x:830,y:530,p:"tca",d:["含 3 个羧基，故称三羧酸循环。","🟧 是协同调节糖、脂代谢的枢纽：抑制 PFK-1，激活乙酰CoA 羧化酶。","产能过剩时经柠檬酸-丙酮酸循环运出线粒体供脂合成。"]},ICT:{a:"IsoCit",n:"异柠檬酸",e:"Isocitrate",f:"C₆H₈O₇",x:960,y:530,p:"tca",d:["顺乌头酸酶催化柠檬酸 ↔ 异柠檬酸（经顺乌头酸中间物）。","🟥 异柠檬酸脱氢酶是 TCA 的第二个限速步骤，受 ADP 激活、ATP 抑制。"]},AKG:{a:"α-KG",n:"α-酮戊二酸",e:"α-Ketoglutarate",f:"C₅H₆O₅",x:960,y:660,p:"tca",d:["🟥 与谷氨酸可互变（转氨基/氧化脱氨基），是糖-氨基酸代谢的枢纽。","由异柠檬酸脱氢酶催化，第一次氧化脱羧，产 NADH。"]},SCC:{a:"SucCoA",n:"琥珀酰辅酶A",e:"Succinyl-CoA",f:"琥珀酰~S—CoA",x:960,y:790,p:"tca",d:["🟥 循环中<b>唯一</b>的底物水平磷酸化：琥珀酰CoA 合成酶催化 GDP＋Pi → GTP。","琥珀酰CoA 也是血红素合成的原料。","可别构抑制 α-酮戊二酸脱氢酶复合体。"]},SUC:{a:"Suc",n:"琥珀酸",e:"Succinate",f:"C₄H₆O₄",x:830,y:790,p:"tca",d:["琥珀酸脱氢酶催化脱氢，辅因子是 <b>FAD</b>（不是 NAD⁺）。","🟥 该酶是 TCA 中唯一结合在线粒体内膜的酶——它就是呼吸链<b>复合体Ⅱ</b>。"]},FUM:{a:"Fum",n:"延胡索酸",e:"Fumarate",f:"C₄H₄O₄",x:700,y:790,p:"tca",d:["延胡索酸酶加水生成苹果酸。","尿素循环中的精氨酸代琥珀酸裂解也产生延胡索酸 → 两循环相连。"]},MAL:{a:"Mal",n:"苹果酸",e:"Malate",f:"C₄H₆O₅",x:700,y:660,p:"tca",d:["苹果酸脱氢酶催化生成草酰乙酸，产 NADH。","苹果酸-天冬氨酸穿梭靠它把胞质 NADH 的还原当量运进线粒体。"]},OAA:{a:"OAA",n:"草酰乙酸",e:"Oxaloacetate",f:"C₄H₄O₅",x:700,y:530,p:"tca",d:['🟥 TCA 的"启动器"：与乙酰CoA 缩合成柠檬酸。',"不能直接穿过线粒体内膜，需先变成苹果酸或天冬氨酸。","主要来自丙酮酸直接羧化（丙酮酸羧化酶，需生物素）。"]},NADH:{a:"NADH",n:"还原当量池（NADH）",e:"NADH pool",f:"C₂₁H₂₇N₇O₁₄P₂",x:620,y:1300,p:"oxphos",d:["来自糖酵解（胞质，需穿梭）、PDH、TCA、β-氧化。","经复合体Ⅰ进入呼吸链，泵 4 H⁺ → 折合 2.5 ATP。","NADPH 不进呼吸链，专供合成代谢与抗氧化。"]},FADH2:{a:"FADH₂",n:"还原当量池（FADH₂）",e:"FADH₂ pool",f:"C₂₇H₃₅N₉O₁₅P₂",x:740,y:1300,p:"oxphos",d:["来自琥珀酸脱氢酶（复合体Ⅱ）与 β-氧化第一步。","从 Q 进入呼吸链，跳过复合体Ⅰ → 只泵 6 H⁺ → 1.5 ATP。",'这就是"FADH₂ 比 NADH 少 1 个 ATP"的全部原因。']},C1:{a:"Ⅰ",n:"复合体Ⅰ（NADH-泛醌还原酶）",e:"Complex I",f:"FMN ＋ Fe-S",x:820,y:1420,p:"oxphos",d:["电子：NADH → Q。泵 4 H⁺。","含 FMN 与铁硫蛋白。","抑制剂：<b>鱼藤酮</b>、阿米妥（安密妥）。"]},C2:{a:"Ⅱ",n:"复合体Ⅱ（琥珀酸-泛醌还原酶）",e:"Complex II",f:"FAD ＋ Fe-S ＋ 血红素 b₅₆₀",x:890,y:1490,p:"oxphos",d:["🟥 <b>不泵质子</b>——所以 FADH₂ 只值 1.5 ATP。","它就是 TCA 的琥珀酸脱氢酶，同一个蛋白。","电子：琥珀酸 → Q。"]},Q:{a:"Q",n:"泛醌（辅酶Q）",e:"Ubiquinone / CoQ₁₀",f:"C₅₉H₉₀O₄",x:970,y:1420,p:"oxphos",d:["🟥 呼吸链中<b>唯一的非蛋白质</b>递氢体，脂溶性，在内膜中自由游动。",'双电子 ↔ 单电子的"换乘站"（细胞色素一次只收 1 个电子）。',"半醌中间态会把电子漏给 O₂ → ROS 的来源。"]},C3:{a:"Ⅲ",n:"复合体Ⅲ（泛醌-细胞色素c还原酶）",e:"Complex III",f:"血红素 b、c₁、Fe-S",x:1110,y:1420,p:"oxphos",d:["电子：Q → Cyt c。经 Q 循环泵 4 H⁺。","抑制剂：<b>抗霉素 A</b>。"]},CYTC:{a:"Cyt c",n:"细胞色素c",e:"Cytochrome c",f:"血红素蛋白（Fe）",x:1250,y:1420,p:"oxphos",d:["🟥 唯一<b>水溶性</b>、位于复合体之外、贴内膜外表面的细胞色素。","接受 1 个电子，交给复合体Ⅳ。","凋亡时从线粒体释放，激活 caspase。"]},C4:{a:"Ⅳ",n:"复合体Ⅳ（细胞色素c氧化酶）",e:"Complex IV",f:"血红素 a、a₃、CuA、CuB",x:1390,y:1420,p:"oxphos",d:["电子：Cyt c → O₂，泵 2 H⁺。","🟥 直接把电子交给 O₂ 的是 <b>Cyt a₃</b>（Fe 与 CuB 构成双核中心）。","抑制剂：<b>CN⁻、CO、H₂S、叠氮化物</b>——结合氧化型 a₃，阻断 O₂ 结合。"]},O2:{a:"O₂ → H₂O",n:"氧（最终受电子体）",e:"Oxygen",f:"O₂ ＋ 4e⁻ ＋ 4H⁺ → 2H₂O",x:1540,y:1420,p:"oxphos",d:['🟥 氧不是"燃烧"底物，而是呼吸链的<b>最终电子受体</b>。',"4 个电子 ＋ 4 个质子 ＋ O₂ → 2 H₂O。","不供氧时整条链堵死，NADH 堆积 → 糖酵解被迫走乳酸。"]},ATP:{a:"ATP",n:"ATP 合酶（复合体Ⅴ）",e:"ATP synthase",f:"F₁（α₃β₃γδε）＋ F₀",x:1760,y:1420,p:"oxphos",d:["蘑菇状：<b>F₁ 亲水</b>，伸向基质，催化位点在 β 亚基；<b>F₀ 疏水</b>，是质子通道。","🟥 每合成并运出 1 个 ATP 需 <b>4 个 H⁺</b> 回流（3 个过合酶 ＋ 1 个转运）。","抑制剂：<b>寡霉素</b>结合 F₀；DNP 是解偶联剂，搬 H⁺ 破坏梯度。","结合变构机制：β 亚基 L→T→O 三种构象循环。"]},FACOA:{a:"Acyl-CoA",n:"脂肪酰CoA（胞质）",e:"Fatty acyl-CoA",f:"R—CO~S—CoA",x:1080,y:520,p:"faox",d:["由脂酰CoA合成酶活化：脂肪酸 ＋ CoA ＋ ATP → 脂酰CoA ＋ AMP ＋ PPi。",'🟥 消耗 <b>2 个高能磷酸键</b>（PPi 被焦磷酸酶水解，把反应"锁死"）。',"长链脂酰CoA 不能直接透过线粒体内膜 → 需肉碱穿梭。"]},ACYLC:{a:"Acylcarnitine",s:"Acyl-Carn",n:"脂肪酰肉碱",e:"Acylcarnitine",f:"R—CO—肉碱",x:1080,y:600,p:"faox",d:["肉碱脂酰转移酶Ⅰ（CPT-Ⅰ，外膜）催化生成。","由肉碱-脂酰肉碱转位酶运过内膜，同时等量肉碱运出。",'🟥 丙二酸单酰CoA 竞争性抑制 CPT-Ⅰ →"糖多则不烧脂"的分子开关。']},FACOA_M:{a:"Acyl-CoA",n:"脂肪酰CoA（基质）",e:"Matrix acyl-CoA",f:"R—CO~S—CoA",x:1080,y:680,p:"faox",d:["由 CPT-Ⅱ（内膜内侧）重新生成。","进入 β-氧化四步循环。","中短链脂肪酸（<12C）可不依赖肉碱直接进入。"]},ENOYL:{a:"Enoyl-CoA",s:"Enoyl",n:"反式-Δ²-烯脂肪酰CoA",e:"trans-Δ²-Enoyl-CoA",f:"R—CH=CH—CO~S—CoA",x:1220,y:680,p:"faox",d:["脂肪酰CoA 脱氢酶催化，🟥 辅因子 <b>FAD</b>（第一步）。","产生 1 个 FADH₂，直接进入复合体Ⅱ/ETC。"]},HYDROXY:{a:"β-OH-acyl-CoA",s:"β-OH-Acyl",n:"L-β-羟脂肪酰CoA",e:"L-β-Hydroxyacyl-CoA",f:"R—CHOH—CH₂—CO~S—CoA",x:1360,y:680,p:"faox",d:["烯脂酰CoA 水化酶加水生成（<b>加水，不是脱水</b>）。","β 碳在这里带上羟基，第三次脱氢就发生在它上面。"]},KETO:{a:"β-Ketoacyl-CoA",s:"β-Keto",n:"β-酮脂肪酰CoA",e:"β-Ketoacyl-CoA",f:"R—CO—CH₂—CO~S—CoA",x:1360,y:800,p:"faox",d:["β-羟脂酰CoA 脱氢酶催化，🟥 辅因子 <b>NAD⁺</b>（第三步）。","产生 1 个 NADH。"]},ACOAF:{a:"AcCoA",n:"乙酰CoA（β-氧化产物）",e:"Acetyl-CoA",f:"CH₃—CO~S—CoA",x:1220,y:800,p:"faox",d:["硫解酶（硫解）切下 1 分子乙酰CoA，碳链缩短 2C。","🟥 <b>每轮只产 1 分子乙酰CoA</b>，不是 2 分子。","乙酰CoA 进 TCA；过量时肝内转而生成酮体。"]},ACAC:{a:"AcAc-CoA",n:"乙酰乙酰CoA",e:"Acetoacetyl-CoA",f:"CH₃COCH₂CO~S—CoA",x:1260,y:980,p:"ketone",d:["2 分子乙酰CoA 由乙酰乙酰CoA 硫解酶缩合生成。","酮体生成的第一步。"]},HMGK:{a:"HMG-CoA",n:"羟甲基戊二酸单酰CoA",e:"HMG-CoA",f:"C₂₇H₄₄N₇O₂₀P₃S",x:1400,y:980,p:"ketone",d:['🟥 <b>HMG-CoA 合酶</b>是酮体生成的关键酶（酮体走"合酶"）。','🟥 别与胆固醇合成的 HMG-CoA <b>还原酶</b>搞混——"酮体合成，胆固醇还原"。',"位于肝线粒体。"]},ACETO:{a:"AcAc",n:"乙酰乙酸",e:"Acetoacetate",f:"CH₃COCH₂COOH（C₄H₆O₃）",x:1540,y:980,p:"ketone",d:["HMG-CoA 裂解酶裂解生成，释放 1 个乙酰CoA。",'可自发脱羧成丙酮（少量，经肺呼出 →"烂苹果味"）。',"肝外由琥珀酰CoA 转硫酶或乙酰乙酸硫激酶活化后利用。"]},BHB:{a:"β-HB",n:"β-羟丁酸",e:"β-Hydroxybutyrate",f:"CH₃CHOHCH₂COOH",x:1680,y:980,p:"ketone",d:["由 β-羟丁酸脱氢酶还原乙酰乙酸生成，占血酮体的 70%。","🟥 分子小、溶于水、能过血脑屏障 → 肝向肝外输出能量的形式。","心肌、肾皮质利用酮体的能力 > 利用葡萄糖。"]},ACE:{a:"Acetone",n:"丙酮",e:"Acetone",f:"CH₃COCH₃",x:1540,y:1070,p:"ketone",d:["生成量很少，不能利用，经肺呼出。","糖尿病酮症时呼气有烂苹果味，来自它。"]},ACOAC:{a:"AcCoA",n:"乙酰CoA（胞质）",e:"Cytosolic acetyl-CoA",f:"CH₃—CO~S—CoA",x:1430,y:300,p:"fas",d:["🟥 线粒体内的乙酰CoA 不能直接出膜，靠<b>柠檬酸-丙酮酸循环</b>运出。","在胞质由 ATP-柠檬酸裂解酶重新生成。","是脂肪酸合成与胆固醇合成的共同起点。"]},MALONYL:{a:"Malonyl-CoA",s:"Malonyl",n:"丙二酸单酰CoA",e:"Malonyl-CoA",f:"HOOC—CH₂—CO~S—CoA",x:1620,y:220,p:"fas",d:["🟥 乙酰CoA 羧化酶的产物，是脂肪酸合成的<b>限速步骤</b>。","同时是 CPT-Ⅰ 的竞争性抑制剂 → 抑制脂肪酸进线粒体氧化。","为合成提供 2 碳单位（脱羧后净加 2C）。"]},PALM:{a:"Palmitate",n:"软脂酸（16C）",e:"Palmitate",f:"CH₃(CH₂)₁₄COOH",x:1770,y:220,p:"fas",d:["🟥 1 分子乙酰CoA ＋ 7 分子丙二酸单酰CoA → 1 分子软脂酸。","合成在胞质，以 ACP 为载体，还原力来自 NADPH（PPP + 苹果酸酶）。","进一步可延长、去饱和（在内质网）。"]},HMG:{a:"HMG-CoA",n:"HMG-CoA（胆固醇支路）",e:"HMG-CoA",f:"C₂₇H₄₄N₇O₂₀P₃S",x:1500,y:480,p:"chol",d:["乙酰CoA → 乙酰乙酰CoA → HMG-CoA，前两步与酮体生成相同。","🟥 但这里走 <b>HMG-CoA 还原酶</b>（胞质/内质网），不是合酶。","他汀类药物即抑制此酶。"]},MVA:{a:"MVA",n:"甲羟戊酸",e:"Mevalonate",f:"C₆H₁₂O₄",x:1630,y:480,p:"chol",d:["HMG-CoA 还原酶消耗 2 NADPH 生成，是<b>限速步骤</b>。","之后经异戊烯焦磷酸 → 鲨烯 → 胆固醇。"]},CHOL:{a:"Chol",n:"胆固醇",e:"Cholesterol",f:"C₂₇H₄₆O",x:1760,y:480,p:"chol",d:["🟥 环戊烷多氢菲骨架，<b>不能彻底氧化供能</b>（没有降解成 CO₂ 的酶系）。","每合成 1 分子耗 18 乙酰CoA、36 ATP、16 NADPH。","调节：胆固醇反馈抑制 HMG-CoA 还原酶、抑制 LDL 受体、AMPK 磷酸化失活。"]},BA:{a:"Bile acid",s:"Bile",n:"胆汁酸",e:"Bile acids",f:"胆酸/鹅脱氧胆酸",x:1900,y:390,p:"chol",d:["胆固醇在肝转变为胆汁酸，是胆固醇最主要的去路。","乳化脂质，促进脂类消化吸收。","可被肠肝循环回收。"]},HORM:{a:"Steroids",s:"Steroids",n:"类固醇激素",e:"Steroid hormones",f:"皮质醇/醛固酮/性激素",x:1900,y:480,p:"chol",d:["肾上腺皮质、性腺以胆固醇为原料合成。","ACTH/cAMP 通过调节胆固醇酯酶与 StAR 蛋白提高原料供应。"]},VITD:{a:"VitD₃",n:"维生素D₃",e:"Vitamin D₃",f:"C₂₇H₄₄O",x:1900,y:570,p:"chol",d:["皮肤 7-脱氢胆固醇经紫外线照射生成。","肝 25-羟化、肾 1α-羟化后成为活性形式，调节钙磷代谢。"]},CM:{a:"CM",n:"乳糜微粒",e:"Chylomicron",f:"apoB48",x:1520,y:680,p:"lp",d:["🟥 转运<b>外源性</b> TG 及胆固醇；小肠黏膜细胞合成，经淋巴入血。","半衰期 5–15 分钟 → 空腹 12–14 小时测不到。","apoC-Ⅱ 激活 LPL，水解 TG；残粒由肝 LRP 摄取。"]},VLDL:{a:"VLDL",n:"极低密度脂蛋白",e:"VLDL",f:"apoB100、E",x:1660,y:680,p:"lp",d:["🟥 转运<b>内源性</b> TG；肝细胞合成。","TG 被 LPL 水解后 → IDL → LDL。","apoC-Ⅱ 激活 LPL；apoC-Ⅲ 抑制 LPL。"]},LDL:{a:"LDL",n:"低密度脂蛋白",e:"LDL",f:"几乎只含 apoB100",x:1800,y:680,p:"lp",d:["🟥 转运<b>内源性胆固醇</b>；是唯一<b>在血浆中生成</b>的脂蛋白。","apoB100 识别 LDL 受体；约 50% 在肝降解。","氧化修饰 LDL 是动脉粥样硬化的关键（泡沫细胞）。"]},HDL:{a:"HDL",n:"高密度脂蛋白",e:"HDL",f:"apoAⅠ、AⅡ",x:1940,y:680,p:"lp",d:["🟥 <b>逆向转运胆固醇</b>（RCT）：把外周胆固醇运回肝。","apoA-Ⅰ 激活 LCAT 酯化胆固醇；apoA-Ⅱ 抑制 LCAT。","蛋白质含量最高（约 50%），密度最大。"]},AA:{a:"AA pool",n:"氨基酸池",e:"Amino acid pool",f:"20 种 L-α-氨基酸",x:850,y:1240,p:"aa",d:["来源：食物、组织蛋白分解、自身合成（非必需）。","去路：合成蛋白质、转变為其他含氮物、分解供能。","分解第一步几乎都是脱氨基。"]},NH3:{a:"NH₃",n:"氨",e:"Ammonia",f:"NH₃ / NH₄⁺",x:990,y:1180,p:"aa",d:["🟥 有毒，尤其对中枢神经系统。血氨必须低浓度。","转运形式：<b>丙氨酸</b>（肌→肝）与<b>谷氨酰胺</b>（脑、肌→肝/肾）。","在肝经尿素循环变成尿素排出。"]},AKA:{a:"α-KA",n:"α-酮酸",e:"α-Keto acids",f:"碳架",x:990,y:1310,p:"aa",d:["🟥 三条去路：①经 TCA 氧化供能；②经糖异生变糖（生糖氨基酸）；③转变成酮体（生酮氨基酸）。","可回补 TCA 中间产物（anaplerosis）。","丙酮酸、α-酮戊二酸、草酰乙酸、琥珀酰CoA、延胡索酸都是 α-酮酸与 TCA 的交点。"]},ORN:{a:"Orn",n:"鸟氨酸",e:"Ornithine",f:"C₅H₁₂N₂O₂",x:1130,y:1180,p:"aa",d:['尿素循环的"载体"，循环一圈又被再生出来。',"与氨甲酰磷酸缩合成瓜氨酸（鸟氨酸氨甲酰转移酶，线粒体）。"]},CITR:{a:"Cit",n:"瓜氨酸",e:"Citrulline",f:"C₆H₁₃N₃O₃",x:1250,y:1240,p:"aa",d:["在胞质与天冬氨酸缩合成精氨酸代琥珀酸。","精氨酸代琥珀酸合成酶是尿素循环的<b>第二个限速酶</b>。"]},ARG:{a:"Arg",n:"精氨酸",e:"Arginine",f:"C₆H₁₄N₄O₂",x:1250,y:1330,p:"aa",d:["精氨酸酶水解生成尿素 ＋ 鸟氨酸，完成循环。","精氨酸也是一氧化氮（NO）的前体。"]},UREA:{a:"Urea",n:"尿素",e:"Urea",f:"CO(NH₂)₂",x:1110,y:1335,p:"aa",d:["🟥 2 个氮：一个来自氨，一个来自天冬氨酸。","只在肝生成，经肾排出。","肝功能严重受损 → 血氨↑ → 肝性脑病。"]},PRPP:{a:"PRPP",n:"磷酸核糖焦磷酸",e:"PRPP",f:"C₅H₁₃O₁₄P₃",x:1040,y:200,p:"nuc",d:['嘌呤与嘧啶合成的共同"活化核糖"。',"由核糖-5-磷酸 ＋ ATP 生成（PRPP 合成酶）。"]},IMP:{a:"IMP",n:"次黄嘌呤核苷酸",e:"IMP",f:"C₁₀H₁₃N₄O₈P",x:1180,y:200,p:"nuc",d:["🟥 嘌呤从头合成的第一个核苷酸，是 AMP/GMP 的共同前体。","限速酶：PRPP 酰胺转移酶（受 AMP、GMP 反馈抑制）。"]},AMP:{a:"AMP",n:"腺苷酸",e:"AMP",f:"C₁₀H₁₄N₅O₇P",x:1320,y:120,p:"nuc",d:["IMP → 腺苷酸代琥珀酸 → AMP，需 GTP 供能。","分解 → 次黄嘌呤 → 黄嘌呤 → 尿酸。"]},GMP:{a:"GMP",n:"鸟苷酸",e:"GMP",f:"C₁₀H₁₄N₅O₈P",x:1320,y:280,p:"nuc",d:["IMP 氧化为 XMP，再氨基化生成 GMP，需 ATP 供能。","分解 → 鸟嘌呤 → 黄嘌呤 → 尿酸。"]},CPS2:{a:"CPS-Ⅱ",n:"氨甲酰磷酸（嘧啶）",e:"Carbamoyl phosphate",f:"NH₂COOPO₃H₂",x:1040,y:320,p:"nuc",d:["🟥 嘧啶合成第一步：谷氨酰胺 ＋ CO₂ ＋ ATP → 氨甲酰磷酸（CPS-Ⅱ，胞质）。","与尿素循环的 CPS-Ⅰ（线粒体，用 NH₃）不同——别混。"]},UMP:{a:"UMP",n:"尿苷酸",e:"UMP",f:"C₉H₁₃N₂O₉P",x:1180,y:320,p:"nuc",d:["嘧啶从头合成的第一个核苷酸。","→ UDP → UTP → CTP；→ dUMP → dTMP。"]},CTP:{a:"CTP",n:"胞苷三磷酸",e:"CTP",f:"C₉H₁₆N₃O₁₄P₃",x:1320,y:360,p:"nuc",d:["UTP ＋ 谷氨酰胺 → CTP（CTP 合成酶）。","RNA 合成底物。"]},DTMP:{a:"dTMP",n:"脱氧胸苷酸",e:"dTMP",f:"C₁₀H₁₅N₂O₈P",x:1320,y:440,p:"nuc",d:["🟥 由 dUMP 甲基化生成，甲基来自 <b>5,10-甲烯四氢叶酸</b>（胸苷酸合酶）。","是 DNA 特有的核苷酸；叶酸/B₁₂ 缺乏时 dTMP 不足 → DNA 合成障碍（巨幼细胞贫血）。","靶点：5-氟尿嘧啶（5-FU）抑制胸苷酸合酶。"]},UA:{a:"Uric acid",s:"Urate",n:"尿酸",e:"Uric acid",f:"C₅H₄N₄O₃",x:1180,y:80,p:"nuc",d:["🟥 人类嘌呤分解的<b>终产物</b>（缺乏尿酸酶，不能变成尿囊素）。","生成过多或排出减少 → 高尿酸血症 → 痛风。","别嘌醇抑制黄嘌呤氧化酶。"]},FFA:{a:"FFA",n:"游离脂肪酸",e:"Free fatty acid",f:"R—COOH",x:1080,y:440,p:"faox",d:["来自<b>脂肪动员</b>：脂肪细胞内 TG 被 HSL 等水解，FFA 释放入血、与清蛋白结合运输。","胰高血糖素、肾上腺素通过 cAMP-PKA 激活脂解；胰岛素抑制。","进入细胞后必须先活化（脂酰CoA 合成酶，耗 2 个高能键）才能进入 β-氧化。"]},OAA_M:{a:"OAA",n:"草酰乙酸（线粒体）",e:"Oxaloacetate (mito)",f:"C₄H₄O₅",x:280,y:1290,p:"gng",d:["🟥 糖异生第一道旁路：丙酮酸 ＋ CO₂ ＋ ATP → 草酰乙酸（<b>丙酮酸羧化酶</b>，辅基生物素）。","需要<b>乙酰CoA 别构激活</b>——脂动员与糖异生由此联动。","线粒体内膜对 OAA 不通透，必须先变成苹果酸或天冬氨酸才能出线粒体。"]},MAL_M:{a:"Mal",n:"苹果酸（线粒体）",e:"Malate (mito)",f:"C₄H₆O₅",x:400,y:1290,p:"gng",d:["线粒体 MDH 把 OAA 还原成苹果酸（消耗 1 个 NADH）。","苹果酸可经<b>苹果酸-α-酮戊二酸转运体</b>穿出线粒体内膜。",'这是"草酰乙酸出不去、苹果酸出得去"的关键一步。']},OAA_C:{a:"OAA",n:"草酰乙酸（胞质）",e:"Oxaloacetate (cytosol)",f:"C₄H₄O₅",x:520,y:1290,p:"gng",d:["胞质 MDH 把苹果酸重新氧化成 OAA（生成 1 个 NADH，相当于把还原当量带回胞质）。","也可走<b>天冬氨酸支路</b>：线粒体 OAA → 天冬氨酸 → 出膜 → 胞质再变回 OAA。","下一步由 PEPCK 脱羧生成 PEP。"]},DTMP:{a:"dTMP",n:"脱氧胸苷酸",e:"dTMP",f:"C₁₀H₁₅N₂O₈P",x:1320,y:440,p:"nuc",d:["🟥 由 dUMP 甲基化生成，甲基来自 <b>5,10-甲烯四氢叶酸</b>（胸苷酸合酶）。","叶酸/B₁₂ 缺乏时 dTMP 不足 → DNA 合成障碍（巨幼细胞贫血）。","靶点：5-氟尿嘧啶抑制胸苷酸合酶。"]}},Pr={PYGL:{a:"GP",n:"糖原磷酸化酶",e:"Glycogen phosphorylase",p:"glyc",key:1,r:"糖原(n) ＋ Pi → 糖原(n−1) ＋ G-1-P",d:["🟥 糖原分解的<b>关键酶</b>，从非还原端<b>磷酸解</b>（不是水解），省 1 个 ATP。","只能切 α-1,4 糖苷键，遇 α-1,6 分支点停下 → 需脱支酶。","肌糖原分解产物 G-6-P 不能脱磷酸，故不补血糖。"],reg:{chain:[{t:"肾上腺素/胰高血糖素"},{t:"cAMP"},{t:"PKA",k:1},{t:"磷酸化酶b激酶 磷酸化"},{t:"糖原磷酸化酶a（活化）",k:1}],act:"AMP（肌，能量不足时）",inh:"ATP、G-6-P（能量充足时）",note:'两种信号都指向"磷酸化＝活化"；胰岛素则经 PP1 去磷酸化 → 失活。'}},GYS:{a:"GS",n:"糖原合酶",e:"Glycogen synthase",p:"glyc",key:1,r:"UDPG ＋ 糖原(n) → 糖原(n+1) ＋ UDP",d:["🟥 糖原合成的<b>关键酶</b>，只延长 α-1,4 链，不能形成分支。","分支由<b>分支酶</b>（α-1,6）完成，可增加非还原端数量。","与磷酸化酶方向相反：<b>去磷酸化＝活化</b>。"],reg:{chain:[{t:"胰岛素"},{t:"蛋白磷酸酶 PP1"},{t:"糖原合酶 去磷酸化"},{t:"活化",k:1}],act:"G-6-P（别构激活，同时使酶对去磷酸化更敏感）",inh:"PKA 磷酸化 → 失活（胰高血糖素、肾上腺素）",note:"一句话：<b>胰岛素开糖原合成、关糖原分解；胰高血糖素相反</b>。同一个磷酸化开关，两个酶反向响应。"}},UGP2:{a:"UGP",n:"UDPG 焦磷酸化酶",p:"glyc",r:"G-1-P ＋ UTP → UDPG ＋ PPi",d:['把葡萄糖"活化"成 UDPG，为糖原合酶提供底物。',"PPi 被焦磷酸酶水解，使反应不可逆（耗 1 个高能键）。"]},PGM1:{a:"PGM",n:"磷酸葡萄糖变位酶",p:"glyc",r:"G-1-P ⇌ G-6-P",d:["糖原与糖酵解之间的双向转换点。","肌肉缺乏葡糖-6-磷酸酶，所以肌糖原分解止于 G-6-P。"]},HK:{a:"HK",n:"己糖激酶",e:"Hexokinase",p:"gly",key:1,r:"葡萄糖 ＋ ATP → G-6-P ＋ ADP（需 Mg²⁺）",d:["🟥 第一个限速步骤，<b>不可逆</b>。","肝内Ⅳ型＝<b>葡糖激酶（GK）</b>：Km≈10 mmol/L，不被 G-6-P 抑制。","其他组织 HK：Km≈0.2 mmol/L，受 G-6-P 反馈抑制。"],reg:{chain:[{t:"血糖升高（餐后）"},{t:"葡萄糖进入肝细胞（GLUT2）"},{t:"葡糖激酶 活性↑",k:1},{t:"G-6-P ↑",k:1}],act:"胰岛素诱导葡糖激酶基因表达（长期调节）",inh:"G-6-P 反馈抑制 HK（<b>GK 无此抑制</b>）",note:'判据：<b>Km 高低决定"谁在平时抓糖、谁在餐后缓冲血糖"</b>。肝用低亲和力 GK，避免与脑、肌抢糖。'}},PGI:{a:"PGI",n:"磷酸己糖异构酶",p:"gly",r:"G-6-P ⇌ F-6-P",d:["醛糖 ↔ 酮糖异构，可逆，需 Mg²⁺。"]},PFK1:{a:"PFK-1",n:"磷酸果糖激酶-1",e:"Phosphofructokinase-1",p:"gly",key:1,r:"F-6-P ＋ ATP → F-1,6-BP ＋ ADP",d:["🟥 <b>整条糖酵解最重要的调控点</b>，第二个不可逆反应。","有<b>两个 ATP 位点</b>：催化位点（ATP 是底物）与别构位点（ATP 是抑制剂，亲和力低）。","F-2,6-BP 是最强激活剂，μmol/L 水平即有效。"],reg:{chain:[{t:"胰高血糖素"},{t:"cAMP"},{t:"PKA",k:1},{t:"PFK-2 磷酸化 → FBP-2 活性↑"},{t:"F-2,6-BP ↓",inh:1},{t:"PFK-1 活性↓",k:1}],act:"AMP、ADP、<b>F-2,6-BP</b>（三者共同取消 ATP/柠檬酸的抑制）",inh:"ATP、柠檬酸（柠檬酸是糖-脂协同调节的枢纽）",note:"肝：进食 → 胰岛素 → F-2,6-BP↑ → 糖酵解开（为了合成糖原和脂肪）。肌：只看 ATP/AMP，缺能即开。"}},ALD:{a:"ALD",n:"醛缩酶",p:"gly",r:"F-1,6-BP ⇌ 磷酸二羟丙酮 ＋ 甘油醛-3-P",d:["C3–C4 裂解，可逆。","醛缩酶 B 缺陷 → 遗传性果糖不耐受。"]},TPI:{a:"TPI",n:"丙糖磷酸异构酶",p:"gly",r:"DHAP ⇌ G-3-P",d:['只让 G-3-P 继续往下走，因此 DHAP 不断被"抽走"。',"DHAP 的另一条出路：还原为甘油-3-磷酸 → 脂合成。"]},GAPDH:{a:"GAPDH",n:"甘油醛-3-磷酸脱氢酶",p:"gly",r:"G-3-P ＋ NAD⁺ ＋ Pi → 1,3-BPG ＋ NADH ＋ H⁺",d:['🟥 唯一产 NADH 的糖酵解步骤；这对氢是后面还原丙酮酸的"弹药"。',"醛基氧化与磷酸化偶联，产物含<b>混合酸酐</b>高能键。",'碘乙酸、砷酸盐作用于该酶（砷酸盐使底物水平磷酸化"短路"）。']},PGK:{a:"PGK",n:"磷酸甘油酸激酶",p:"gly",r:"1,3-BPG ＋ ADP ⇌ 3-PG ＋ ATP",d:["🟥 <b>第一次底物水平磷酸化</b>，产 1 ATP（×2＝2）。","可逆，但逆反应要消耗 1 ATP。"]},PGM:{a:"PGM",n:"磷酸甘油酸变位酶",p:"gly",r:"3-PG ⇌ 2-PG",d:["磷酸从 C3 移到 C2，需 Mg²⁺。"]},ENO:{a:"ENO",n:"烯醇化酶",p:"gly",r:"2-PG → PEP ＋ H₂O",d:["脱水 + 分子内电子重排，<b>造出一个高能磷酸键</b>。","氟化物可抑制此酶（故采血加氟化钠可防糖酵解）。"]},PK:{a:"PK",n:"丙酮酸激酶",e:"Pyruvate kinase",p:"gly",key:1,r:"PEP ＋ ADP → 丙酮酸 ＋ ATP",d:["🟥 第三个不可逆反应，<b>第二次底物水平磷酸化</b>（×2＝2 ATP）。","激活：F-1,6-BP（前馈）；抑制：ATP、肝内丙氨酸。","激素：PKA／Ca²⁺-钙调蛋白激酶磷酸化 → 失活。"],reg:{chain:[{t:"胰高血糖素/饥饿"},{t:"cAMP"},{t:"PKA",k:1},{t:"丙酮酸激酶 磷酸化",inh:1},{t:"糖酵解流量↓ ／ 糖异生↑",k:1}],act:'F-1,6-BP（别构，前馈"越有底物越加速"）；ADP/AMP↑（缺能时）',inh:"ATP；肝内<b>丙氨酸</b>（提示氮多、糖异生优先）",note:'⚠️ 同一页会出现"激活"和"失活"两句矛盾话：<b>能量状态→激活，激素信号→失活</b>，按题面问的是哪个来答。'}},LDH:{a:"LDH",n:"乳酸脱氢酶",p:"gly",r:"丙酮酸 ＋ NADH ＋ H⁺ ⇌ 乳酸 ＋ NAD⁺",d:['🟥 目的不是"处理丙酮酸"，而是把 <b>NAD⁺ 还回去</b>——否则 GAPDH 断供、糖酵解停摆。',"心肌 LDH₁ 富含，对乳酸亲和力高（可反向利用乳酸）。","缺氧/卒中时 LDH 释放入血，是细胞损伤标志。"]},G6PD:{a:"G6PD",n:"葡糖-6-磷酸脱氢酶",e:"Glucose-6-phosphate dehydrogenase",p:"ppp",key:1,r:"G-6-P ＋ NADP⁺ → 6-磷酸葡萄糖酸内酯 ＋ NADPH",d:["🟥 该途径的<b>限速酶、不可逆</b>，受 NADPH/NADP⁺ 比值调节。","NADPH↑ 别构抑制；NADP⁺↑ 激活 → 流量取决于<b>还原力需求</b>。","🟥 G6PD 缺乏 → 蚕豆病（红细胞 NADPH 不足，GSH 无法还原，膜被氧化破裂）。"],reg:{chain:[{t:"NADPH/NADP⁺ 比值↓"},{t:"G6PD 活性↑",k:1},{t:"NADPH 生成↑",k:1}],act:"NADP⁺；高碳水饮食（酶含量↑，适应脂合成需要 NADPH）",inh:"NADPH（产物反馈）",note:'一句话：<b>这条路的流量由"要不要 NADPH"决定，不由"要不要 ATP"决定。</b>'}},PGLS:{a:"内酯酶",n:"6-磷酸葡萄糖酸内酯酶",p:"ppp",r:"内酯 ＋ H₂O → 6-磷酸葡萄糖酸",d:["水解开环，不可逆方向。"]},PGD6:{a:"6PGD",n:"6-磷酸葡萄糖酸脱氢酶",p:"ppp",r:"6-PG ＋ NADP⁺ → 核酮糖-5-P ＋ NADPH ＋ CO₂",d:["氧化脱羧，第二个 NADPH 产生。","每 1 分子 G-6-P 共得 2 NADPH。"]},RPI:{a:"RPI",n:"核糖-5-磷酸异构酶",p:"ppp",r:"Ru-5-P ⇌ R-5-P",d:["为核苷酸合成提供核糖。"]},RPE:{a:"RPE",n:"核酮糖-5-磷酸差向异构酶",p:"ppp",r:"Ru-5-P ⇌ Xu-5-P",d:["进入基团转移阶段。"]},TKT:{a:"TKT/TAL",n:"转酮醇酶／转醛醇酶",p:"ppp",r:"3 戊糖磷酸 → 2 F-6-P ＋ 1 G-3-P",d:["转酮醇酶移 2 碳单位，转醛醇酶移 3 碳单位。",'把不需要的戊糖"拼回"糖酵解中间物，碳不浪费。',"硫胺素（TPP）是转酮醇酶的辅酶。"]},PC:{a:"PC",n:"丙酮酸羧化酶",e:"Pyruvate carboxylase",p:"gng",key:1,r:"丙酮酸 ＋ CO₂ ＋ ATP → 草酰乙酸 ＋ ADP ＋ Pi（线粒体，生物素）",d:["🟥 糖异生<b>第一个旁路</b>，替代丙酮酸激酶，耗 1 ATP。","辅基<b>生物素</b>；<b>乙酰CoA 是必需的别构激活剂</b>。","线粒体内生成的 OAA 不能直接出膜 → 先变苹果酸或天冬氨酸。"],reg:{chain:[{t:"饥饿/胰高血糖素"},{t:"脂肪动员↑"},{t:"线粒体 乙酰CoA ↑"},{t:"丙酮酸羧化酶 激活",k:1},{t:"糖异生↑",k:1}],act:'乙酰CoA（别构，把"脂多"翻译成"该做糖了"）',inh:"—",note:'这是糖异生与脂肪动员之间的分子握手：<b>烧脂肪酸产生的乙酰CoA 直接给糖异生"开绿灯"</b>。'}},FBP1:{a:"F-1,6-BPase",n:"果糖二磷酸酶-1",e:"Fructose-1,6-bisphosphatase-1",p:"gng",key:1,r:"F-1,6-BP ＋ H₂O → F-6-P ＋ Pi",d:["🟥 第二个旁路，替代 PFK-1，绕开不可逆步骤。",'与 PFK-1 构成<b>底物循环</b>：两个酶同时有活性就"空转"耗能。',"别构抑制：AMP、F-2,6-BP。"],reg:{chain:[{t:"胰高血糖素"},{t:"cAMP"},{t:"PKA",k:1},{t:"PFK-2 磷酸化 → F-2,6-BP ↓"},{t:"F-1,6-BPase 解除抑制",k:1}],act:"—（柠檬酸可缓解 AMP 抑制）",inh:"AMP、<b>F-2,6-BP</b>（一个信号同时关糖酵解、开糖异生）",note:"<b>F-2,6-BP 是双向开关</b>：PFK-1 的激活剂，同时是 F-1,6-BPase 的抑制剂。一个分子管两个方向。"}},G6PASE:{a:"G-6-Pase",n:"葡糖-6-磷酸酶",p:"gng",key:1,r:"G-6-P ＋ H₂O → 葡萄糖 ＋ Pi（内质网）",d:['🟥 只在<b>肝、肾</b>表达，是"糖原分解能补血糖"与"糖异生能输出葡萄糖"的共同前提。',"<b>肌缺乏此酶</b> → 肌糖原不能直接补血糖（五层因果的核心）。","糖原贮积症Ⅰ型（von Gierke）即此酶缺陷 → 空腹低血糖、肝大。"],reg:{chain:[{t:"空腹"},{t:"胰高血糖素↑ / 胰岛素↓"},{t:"酶活性↑",k:1},{t:"肝释放葡萄糖",k:1}],act:"—",inh:"胰岛素（抑制转录）",note:'胰岛素是它唯一的"总开关"：进食后关闭，避免肝一边收糖一边放糖。'}},PDH:{a:"PDH",n:"丙酮酸脱氢酶复合体",e:"Pyruvate dehydrogenase complex",p:"tca",key:1,r:"丙酮酸 ＋ CoA ＋ NAD⁺ → 乙酰CoA ＋ CO₂ ＋ NADH",d:["🟥 <b>3 种酶 ＋ 5 种辅因子</b>：E1（TPP）、E2（硫辛酸、CoA）、E3（FAD、NAD⁺）——<b>不含生物素</b>。",'不可逆，把糖代谢"送进"线粒体并锁死方向。',"缺陷 → 乳酸酸中毒、神经退行（Leigh 病）。"],reg:{chain:[{t:"胰岛素"},{t:"PDH 磷酸酶",k:1},{t:"PDH 去磷酸化",k:1},{t:"活化",k:1}],act:"ADP、Ca²⁺（线粒体内 Ca²⁺↑ 直接激活）",inh:"<b>乙酰CoA、NADH、ATP</b>（产物反馈，激活 PDH 激酶 → 磷酸化失活）",note:"记住这对反向酶：<b>PDH 激酶＝关，PDH 磷酸酶＝开</b>。产物多就关，激素（胰岛素）来就开。"}},CS:{a:"CS",n:"柠檬酸合酶",e:"Citrate synthase",p:"tca",key:1,r:"乙酰CoA ＋ 草酰乙酸 ＋ H₂O → 柠檬酸 ＋ CoA",d:["🟥 TCA <b>第一个限速步骤、不可逆</b>；能量来自乙酰CoA 的高能硫酯键。","对草酰乙酸 Km 极小 → 只要 OAA 够，反应就跑。",'⚠️ <b>没有"柠檬酸脱氢酶"</b>——这一步是缩合，不是脱氢。'],reg:{chain:[{t:"ATP、NADH、柠檬酸 ↑"},{t:"柠檬酸合酶 抑制",inh:1},{t:"TCA 减速",k:1}],act:"ADP（缺能信号）、草酰乙酸浓度",inh:"ATP、NADH、<b>柠檬酸</b>（产物反馈）、琥珀酰CoA",note:'柠檬酸在这里是"产物抑制"，跑到胞质又变成"脂合成激活剂"——同一分子，两个身份。'}},ACO:{a:"ACO",n:"顺乌头酸酶",p:"tca",r:"柠檬酸 ⇌ 顺乌头酸 ⇌ 异柠檬酸",d:["可逆；氟化物可抑制。","顺乌头酸与酶结合成复合物，不游离释放。"]},ICDH:{a:"ICDH",n:"异柠檬酸脱氢酶",e:"Isocitrate dehydrogenase",p:"tca",key:1,r:"异柠檬酸 ＋ NAD⁺ → α-酮戊二酸 ＋ CO₂ ＋ NADH",d:["🟥 第二个限速步骤、不可逆；<b>第一次氧化脱羧</b>。","与 α-KGDH 一起被认为是 TCA 更重要的调节位点。","Mg²⁺/Mn²⁺ 依赖。"],reg:{chain:[{t:"ADP、Ca²⁺ ↑"},{t:"异柠檬酸脱氢酶 激活",k:1},{t:"TCA 加速",k:1}],act:"ADP、<b>Ca²⁺</b>（肌肉收缩时线粒体 Ca²⁺↑ → 直接降低 Km）",inh:"ATP、NADH",note:'Ca²⁺ 把"肌肉在收缩"翻译成"TCA 快转、多产 NADH"——兴奋-代谢偶联的分子基础。'}},KGDH:{a:"α-KGDH",n:"α-酮戊二酸脱氢酶复合体",e:"α-Ketoglutarate dehydrogenase",p:"tca",key:1,r:"α-酮戊二酸 ＋ CoA ＋ NAD⁺ → 琥珀酰CoA ＋ CO₂ ＋ NADH",d:["🟥 第三个限速步骤、不可逆；<b>第二次氧化脱羧</b>。","组成与机制同 PDH 复合体（同样 3 酶 5 辅因子）。","受<b>琥珀酰CoA</b>与 NADH 反馈抑制。"],reg:{chain:[{t:"NADH、琥珀酰CoA、ATP ↑"},{t:"α-KGDH 抑制",inh:1},{t:"TCA 减速",k:1}],act:"Ca²⁺（降低对底物 Km）、ADP",inh:"NADH、琥珀酰CoA、ATP",note:'TCA 的"刹车"几乎都由产物自己踩——这就是为什么缺氧时（NADH 堆）它最先停。'}},SCS:{a:"SCS",n:"琥珀酰CoA 合成酶",p:"tca",r:"琥珀酰CoA ＋ GDP ＋ Pi → 琥珀酸 ＋ GTP ＋ CoA",d:["🟥 <b>循环中唯一的底物水平磷酸化</b>，产 1 GTP（可转为 ATP）。","有两种同工酶，组织分布不同（了解）。"]},SDH:{a:"SDH",n:"琥珀酸脱氢酶",e:"Succinate dehydrogenase",p:"tca",r:"琥珀酸 ＋ FAD → 延胡索酸 ＋ FADH₂",d:["🟥 TCA 中<b>唯一结合在线粒体内膜</b>的酶——它就是呼吸链<b>复合体Ⅱ</b>。","辅因子是 <b>FAD</b>（不是 NAD⁺）→ 只值 1.5 ATP。","抑制剂：丙二酸（竞争性）、TTFA。"]},FH:{a:"FH",n:"延胡索酸酶",p:"tca",r:"延胡索酸 ＋ H₂O → 苹果酸",d:["反式双键加水，立体专一。"]},MDH:{a:"MDH",n:"苹果酸脱氢酶",p:"tca",r:"苹果酸 ＋ NAD⁺ → 草酰乙酸 ＋ NADH",d:["可逆，但 OAA 被柠檬酸合酶不断消耗 → 正向进行。","胞质型 MDH 参与苹果酸-天冬氨酸穿梭。"]},CPT1:{a:"CPT-Ⅰ",n:"肉碱脂酰转移酶Ⅰ",e:"Carnitine palmitoyltransferase I",p:"faox",key:1,r:"脂肪酰CoA ＋ 肉碱 → 脂肪酰肉碱 ＋ CoA（线粒体外膜）",d:["🟥 <b>β-氧化的关键酶</b>：脂酰CoA 进线粒体是限速步骤。",'⚠️ 关键酶是"转移酶Ⅰ"，不是"转位酶"；Ⅰ在外膜，Ⅱ在内膜内侧。',"受<b>丙二酸单酰CoA 竞争性抑制</b> → 糖多则不烧脂。"],reg:{chain:[{t:"饥饿/高脂低糖/糖尿病"},{t:"胰高血糖素↑"},{t:"丙二酸单酰CoA ↓"},{t:"CPT-Ⅰ 解除抑制",k:1},{t:"β-氧化↑ ／ 酮体↑",k:1}],act:"饥饿、高脂膳食、运动（脂解↑，丙二酸单酰CoA↓）",inh:"<b>丙二酸单酰CoA</b>（饱食、糖代谢旺盛时↑）",note:'这是全身"烧糖还是烧脂"的总闸门：<b>胰岛素高 → ACC 开 → 丙二酸单酰CoA 多 → CPT-Ⅰ 关</b>。'}},CPT2:{a:"CPT-Ⅱ",n:"肉碱脂酰转移酶Ⅱ",p:"faox",r:"脂肪酰肉碱 ＋ CoA → 脂肪酰CoA ＋ 肉碱（内膜内侧）",d:["把脂酰基交回 CoA，真正进入基质。",'与转位酶协同完成"肉碱穿梭"。']},ACADH:{a:"ACAD",n:"脂肪酰CoA 脱氢酶",p:"faox",r:"脂酰CoA ＋ FAD → 反式-Δ²-烯脂酰CoA ＋ FADH₂",d:['🟥 β-氧化第一步，<b>辅因子 FAD</b>（"第一酶用 FAD"）。',"中链酰基CoA 脱氢酶（MCAD）缺陷 → 空腹低血糖、不能耐受饥饿。"]},ECH:{a:"ECH",n:"烯脂酰CoA 水化酶",p:"faox",r:"烯脂酰CoA ＋ H₂O → L-β-羟脂酰CoA",d:["<b>加水</b>，不是脱水（易错点）。"]},HADH:{a:"HAD",n:"β-羟脂酰CoA 脱氢酶",p:"faox",r:"β-羟脂酰CoA ＋ NAD⁺ → β-酮脂酰CoA ＋ NADH",d:['🟥 第三步，<b>辅因子 NAD⁺</b>（"第三酶用 NAD⁺"）。']},KAT:{a:"KAT",n:"β-酮脂酰CoA 硫解酶",p:"faox",r:"β-酮脂酰CoA ＋ CoA → 乙酰CoA ＋ 少 2C 的脂酰CoA",d:["🟥 硫解，<b>每轮只产 1 分子乙酰CoA</b>（不是 2 分子）。","四步口诀：<b>脱、加、脱、硫</b>。"]},HMGS:{a:"HMGS",n:"HMG-CoA 合酶",e:"HMG-CoA synthase",p:"ketone",key:1,r:"乙酰乙酰CoA ＋ 乙酰CoA → HMG-CoA ＋ CoA",d:['🟥 酮体生成的<b>关键酶</b>（"酮体合成"）。',"⚠️ 与胆固醇合成的 HMG-CoA <b>还原酶</b>区分：<b>酮体走合酶，胆固醇走还原酶</b>。","肝线粒体内进行。"],reg:{chain:[{t:"饥饿/糖尿病"},{t:"脂肪动员↑ → β-氧化↑"},{t:"乙酰CoA ↑ ／ 草酰乙酸 ↓"},{t:"HMG-CoA 合酶 通量↑",k:1},{t:"酮体↑",k:1}],act:"游离脂肪酸供应↑（底物推动）",inh:"胰岛素（抑制脂肪动员 → 底物减少）",note:'酮体生成的本质不是"酶被激活"，而是<b>底物推着走</b>：乙酰CoA 多、草酰乙酸少，它只能往酮体走。'}},HMGL:{a:"HMGL",n:"HMG-CoA 裂解酶",p:"ketone",r:"HMG-CoA → 乙酰乙酸 ＋ 乙酰CoA",d:["释放乙酰乙酸，即第一个酮体。"]},BDH:{a:"BDH",n:"β-羟丁酸脱氢酶",p:"ketone",r:"乙酰乙酸 ＋ NADH ＋ H⁺ ⇌ β-羟丁酸 ＋ NAD⁺",d:["决定乙酰乙酸/β-羟丁酸的比例；β-羟丁酸占血酮体约 70%。"]},ACLY:{a:"ACLY",n:"ATP-柠檬酸裂解酶",p:"fas",r:"柠檬酸 ＋ CoA ＋ ATP → 乙酰CoA ＋ 草酰乙酸 ＋ ADP ＋ Pi",d:['在胞质再生乙酰CoA，是柠檬酸-丙酮酸循环的"下船点"。']},ACC:{a:"ACC",n:"乙酰CoA 羧化酶",e:"Acetyl-CoA carboxylase",p:"fas",key:1,r:"乙酰CoA ＋ HCO₃⁻ ＋ ATP → 丙二酸单酰CoA ＋ ADP ＋ Pi",d:["🟥 <b>脂肪酸合成的关键酶（限速步骤）</b>，辅基<b>生物素</b>，Mn²⁺ 激活。","产物丙二酸单酰CoA 同时抑制 CPT-Ⅰ → 一手开合成、一手关氧化。","别构：柠檬酸/异柠檬酸 → 聚合成有活性的多聚体；长链脂酰CoA → 解聚失活。"],reg:{chain:[{t:"胰岛素"},{t:"蛋白磷酸酶"},{t:"ACC 去磷酸化",k:1},{t:"丙二酸单酰CoA ↑",k:1},{t:"脂合成↑ ／ β-氧化↓",k:1}],act:"<b>柠檬酸、异柠檬酸</b>（别构聚合）；胰岛素（去磷酸化）；高糖膳食（酶合成↑）",inh:"<b>长链脂酰CoA</b>（解聚）；AMPK 磷酸化（胰高血糖素）",note:"口诀：<b>柠檬酸激活，长链脂酰CoA 抑制；胰岛素去磷酸化开，胰高血糖素磷酸化关。</b>"}},FAS:{a:"FAS",n:"脂肪酸合酶",p:"fas",r:"乙酰CoA ＋ 7 丙二酸单酰CoA ＋ 14 NADPH → 软脂酸 ＋ 7 CO₂",d:["多酶复合体，以 ACP 为载体，每轮加 2C，共 7 轮。","还原力来自 NADPH：戊糖磷酸途径 ＋ 苹果酸酶。"]},ACS:{a:"ACS",n:"脂酰CoA 合成酶",p:"fas",r:"脂肪酸 ＋ CoA ＋ ATP → 脂酰CoA ＋ AMP ＋ PPi",d:["活化耗 2 个高能磷酸键（ATP→AMP 一个，PPi 水解一个）。"]},HMGCR:{a:"HMGCR",n:"HMG-CoA 还原酶",e:"HMG-CoA reductase",p:"chol",key:1,r:"HMG-CoA ＋ 2 NADPH → 甲羟戊酸 ＋ 2 NADP⁺ ＋ CoA",d:["🟥 <b>胆固醇合成的关键酶（限速步骤）</b>，在内质网。","<b>他汀类</b>药物（辛伐他汀等）的结构类似物竞争性抑制此酶。",'"五重受控"：反馈抑制、酶合成↓、酶降解↑、磷酸化失活、激素调节。'],reg:{chain:[{t:"细胞内胆固醇 ↑"},{t:"HMG-CoA 还原酶 合成↓ / 降解↑",inh:1},{t:"胆固醇合成↓",k:1}],act:"胰岛素、甲状腺激素（诱导酶合成）；蛋白磷酸酶去磷酸化（激活）",inh:"<b>胆固醇</b>（反馈）；胰高血糖素经 AMPK 磷酸化 → 失活；他汀",note:"判据：<b>降胆固醇药为什么在晚上吃</b>——胆固醇合成有昼夜节律，夜间（尤其午夜前后）最旺。"}},ALT:{a:"ALT/AST",n:"转氨酶（丙氨酸/天冬氨酸氨基转移酶）",p:"aa",r:"丙氨酸 ＋ α-酮戊二酸 ⇌ 丙酮酸 ＋ 谷氨酸",d:["🟥 辅酶是<b>维生素B₆ 的磷酸酯（PLP）</b>，转氨基的通用辅酶。","ALT 主要在肝，AST 主要在心肌/肝 → 临床判断肝损。",'转氨基只是"搬家"，<b>没有真正脱去氨</b>。']},GLDH:{a:"GLDH",n:"L-谷氨酸脱氢酶",p:"aa",r:"谷氨酸 ＋ NAD(P)⁺ ⇌ α-酮戊二酸 ＋ NH₃ ＋ NAD(P)H",d:["🟥 肝内唯一能<b>真正氧化脱氨基</b>的酶，是联合脱氨基的中心。","别构：<b>ATP、GTP 抑制；ADP、GDP 激活</b>（能量状态调节）。",'与转氨酶联合 → "转氨基＋氧化脱氨基＝联合脱氨基"。']},CPS1:{a:"CPS-Ⅰ",n:"氨甲酰磷酸合成酶Ⅰ",e:"Carbamoyl phosphate synthetase I",p:"aa",key:1,r:"NH₃ ＋ CO₂ ＋ 2ATP → 氨甲酰磷酸（线粒体）",d:["🟥 尿素循环的<b>限速酶</b>，在肝线粒体。","绝对需要<b>N-乙酰谷氨酸（AGA）</b>作为别构激活剂。","⚠️ 与嘧啶合成的 CPS-Ⅱ 区分：<b>Ⅰ 在线粒体用 NH₃，Ⅱ 在胞质用谷氨酰胺</b>。"],reg:{chain:[{t:"高蛋白膳食/饥饿"},{t:"氨负荷↑"},{t:"CPS-Ⅰ 活性↑（AGA）",k:1},{t:"尿素生成↑",k:1}],act:"<b>N-乙酰谷氨酸</b>（AGA，必需别构激活剂）；精氨酸",inh:"—",note:'CPS-Ⅰ 缺陷 → 高氨血症；这是"蛋白质吃太多也中毒"的分子解释。'}},OTC:{a:"OTC",n:"鸟氨酸氨甲酰转移酶",p:"aa",r:"氨甲酰磷酸 ＋ 鸟氨酸 → 瓜氨酸",d:["线粒体内；缺陷是最常见的尿素循环遗传病（OTC 缺乏）。"]},ASS:{a:"ASS",n:"精氨酸代琥珀酸合成酶",p:"aa",r:"瓜氨酸 ＋ 天冬氨酸 ＋ ATP → 精氨酸代琥珀酸",d:["🟥 尿素循环的<b>第二个限速酶</b>；第二个氮就来自天冬氨酸。"]},ARG1:{a:"精氨酸酶",n:"精氨酸酶",p:"aa",r:"精氨酸 ＋ H₂O → 尿素 ＋ 鸟氨酸",d:["完成循环并再生鸟氨酸。"]},PRPS:{a:"PRPS",n:"PRPP 合成酶",p:"nuc",r:"核糖-5-P ＋ ATP → PRPP ＋ AMP",d:['把戊糖磷酸途径的产物"活化"。']},PPAT:{a:"PPAT",n:"PRPP 酰胺转移酶",e:"PRPP amidotransferase",p:"nuc",key:1,r:"PRPP ＋ 谷氨酰胺 → 5-磷酸核糖胺",d:["🟥 嘌呤从头合成的<b>限速酶</b>，受 AMP、GMP
